<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图标生成源</title>
<style>
  html, body { margin: 0; padding: 0; width: 512px; height: 512px; overflow: hidden; }
  .icon {
    width: 512px;
    height: 512px;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 34% 26%, #1b6d9c 0%, #0c3b64 42%, #061a30 100%);
    font-size: 250px;
    line-height: 1;
    user-select: none;
    -webkit-user-select: none;
  }
  .icon::after {
    content: "";
    position: absolute;
    width: 512px;
    height: 512px;
    background: radial-gradient(closest-side, rgba(79,195,247,.35), transparent 72%);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="icon">🐋</div>
</body>
</html>
