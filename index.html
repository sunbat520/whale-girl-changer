<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#06101f">
  <title>鲸鱼娘变化器</title>

  <!-- PWA：可添加到主屏幕 / 全屏独立运行 -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="鲸鱼娘">
  <meta name="application-name" content="鲸鱼娘变化器">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <main class="stage">
    <header class="masthead">
      <p class="eyebrow" id="eyebrow">WHALE‑GIRL RHEOSTAT</p>
      <h1 class="title" id="title">鲸鱼娘变化器</h1>
      <p class="subtitle" id="subtitle">拖动滑片，调节今天的鲸系浓度</p>
    </header>

    <div class="display-wrap">
      <section class="display" id="display" aria-label="鲸鱼娘形象">
      <div class="frame-stack" id="frameStack">
        <p class="empty-hint" id="emptyHint">
          把 5 张图片放进 <code>assets/aligned/</code>，命名为<br>
          <code>a.jpeg · c.jpeg · d.jpeg · g.jpeg · h.jpeg</code>
        </p>
        <!-- 主题四画面层：神临立绘 + sprite 动作图集 + 破壁，逐帧由点击推进 -->
        <div class="burst-frame" id="burstFrame" aria-hidden="true"></div>
      </div>

      <!-- 撞玻璃层：滑片一动，她就贴到玻璃上撞一下 -->
      <div class="impact" id="impact" aria-hidden="true">
        <img class="impact-frame" id="impactFrame" alt="" draggable="false">
        <div class="impact-glass" aria-hidden="true"></div>
        <div class="impact-flash" id="impactFlash" aria-hidden="true"></div>
        <svg class="impact-cracks" id="impactCracks" viewBox="0 0 200 200" aria-hidden="true" preserveAspectRatio="none">
          <g class="crack-ring">
            <path d="M100 100 L92 74 L99 52 L93 26"/>
            <path d="M100 100 L124 86 L146 92 L178 76"/>
            <path d="M100 100 L118 116 L132 142 L154 158"/>
            <path d="M100 100 L82 114 L64 112 L38 130"/>
            <path d="M100 100 L96 128 L104 152 L94 178"/>
            <path d="M100 100 L74 88 L52 66 L26 52"/>
            <path d="M99 52 L118 48 L132 28"/>
            <path d="M132 142 L150 140 L172 152"/>
            <path d="M64 112 L58 134 L42 148"/>
          </g>
          <g class="crack-web">
            <path d="M92 74 L108 70 L99 52"/>
            <path d="M124 86 L120 74 L132 28"/>
            <path d="M118 116 L124 86"/>
            <path d="M82 114 L74 88"/>
            <path d="M96 128 L82 114"/>
            <path d="M104 152 L118 158 L132 142"/>
            <path d="M64 112 L70 100 L74 88"/>
          </g>
        </svg>
      </div>

      <div class="display-glow" aria-hidden="true"></div>
      </section>
    </div>

    <div class="caption" aria-live="polite">
      <div class="caption-line">
        <span class="caption-level" id="captionLevel">Lv.3</span>
        <h2 class="caption-name" id="captionName">鲸灵</h2>
      </div>
      <p class="caption-desc" id="captionDesc">海水开始绕着指尖打转。</p>
    </div>

    <section class="rheostat" aria-label="鲸系浓度调节器">
      <div class="mode-tabs" id="modeTabs" role="tablist" aria-label="模式" hidden>
        <button class="mode-tab is-active" id="modeCup" role="tab" aria-selected="true" type="button">杯型</button>
        <button class="mode-tab" id="modeRush" role="tab" aria-selected="false" type="button">冲撞</button>
      </div>

      <!-- 主题四：第一行动作，第二行身材（按钮由 app.js 按 BURST_BODIES / BURST_SETS 生成） -->
      <div class="burst-modes" id="burstModes" role="group" aria-label="主题四动作" hidden>
        <div class="burst-row burst-row-actions" id="burstActions"></div>
        <div class="burst-row burst-row-bodies" id="burstBodies" role="group" aria-label="身材"></div>
      </div>

      <!-- 主题四：上为神临（点击推进一帧，按住 2 秒自动播放连招），下为破壁（5 种身材共用的突破次元动画） -->
      <div class="burst-pad" id="burstPad" hidden>
        <button class="burst-btn burst-btn-tap" id="burstTap" type="button">
          <span class="burst-tap-main">神临</span>
          <span class="burst-tap-sub" id="burstTapSub">神临</span>
          <span class="burst-tap-hint">（长按 2 秒自动播放）</span>
        </button>
        <button class="burst-btn burst-btn-break" id="burstBreak" type="button">
          <span class="burst-break-main">破壁</span>
          <span class="burst-break-sub">突破次元</span>
        </button>
      </div>

      <div class="meter">
        <span class="meter-value" id="meterValue">50</span>
        <span class="meter-unit">%</span>
        <span class="meter-label" id="meterLabel">鲸度</span>
      </div>

      <div class="rail-wrap">
        <div class="track" id="track">
          <div class="track-coil" aria-hidden="true"></div>
          <div class="track-fill" id="trackFill" aria-hidden="true"></div>
          <div class="track-glow" id="trackGlow" aria-hidden="true"></div>
          <div class="slider" id="slider" role="slider" tabindex="0"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"
               aria-valuetext="Lv.3 鲸灵" aria-label="鲸系浓度">
            <span class="slider-grooves" aria-hidden="true"></span>
            <span class="slider-emoji" aria-hidden="true">🐋</span>
            <span class="slider-cap" aria-hidden="true"></span>
          </div>
        </div>
        <div class="ticks" id="ticks" aria-hidden="true"></div>
      </div>

      <div class="grade-labels" id="gradeLabels" aria-hidden="true"></div>
    </section>

    <footer class="controls">
      <button class="ghost-btn" id="soundToggle" type="button" aria-pressed="true">
        <span id="soundIcon">🔊</span><span id="soundText">音效开</span>
      </button>
      <button class="ghost-btn" id="settingsToggle" type="button">
        <span>⚙</span><span>设置</span>
      </button>
    </footer>
  </main>

  <aside class="settings" id="settings" aria-hidden="true" aria-label="设置面板">
    <div class="settings-head">
      <h2>设置</h2>
      <button class="icon-btn" id="settingsClose" type="button" aria-label="关闭设置">✕</button>
    </div>

    <div class="settings-body">
      <fieldset class="fieldset">
        <legend>主题</legend>
        <label class="field">
          <span>展示主题</span>
          <select id="inputTheme" class="select">
            <option value="classic">主题一 · 经典滑轨（默认）</option>
            <option value="v2">主题二 · 鲸鱼娘 v2 六档</option>
            <option value="gemini">主题三 · 五档身材 A–E</option>
            <option value="burst">主题四 · 暴击展示</option>
          </select>
        </label>
      </fieldset>

      <label class="field">
        <span>标题</span>
        <input type="text" id="inputTitle" maxlength="24">
      </label>

      <label class="field">
        <span>副标题</span>
        <input type="text" id="inputSubtitle" maxlength="40">
      </label>

      <fieldset class="fieldset">
        <legend>档位名称与文案</legend>
        <div id="gradeFields" class="grade-fields"></div>
      </fieldset>

      <fieldset class="fieldset">
        <legend>主题色</legend>
        <div class="swatches" id="swatches"></div>
        <label class="field inline">
          <span>自定义</span>
          <input type="color" id="inputAccent" value="#4fc3f7">
        </label>
      </fieldset>

      <fieldset class="fieldset" id="impactField">
        <legend>撞玻璃</legend>
        <label class="field">
          <span>撞击动画</span>
          <select id="inputImpact" class="select"></select>
        </label>
        <button class="btn-ghost" id="impactPreview" type="button">试撞一下</button>
      </fieldset>

      <button class="btn-ghost" id="resetBtn" type="button">恢复默认</button>
      <button class="btn-ghost" id="checkUpdate" type="button">检查更新</button>
      <p class="build-tag">构建 <span id="buildTag">—</span></p>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <script src="assets/burst/sets.js"></script>
  <script src="app.js"></script>
</body>
</html>
